services:
  - type: web
    name: jobbsoker-ai-backend
    env: docker
    rootDir: backend
    plan: starter
    autoDeploy: true

    # The backend listens on 8000 (see backend/Dockerfile)
    healthCheckPath: /health

    envVars:
      - key: APP_DATA_DIR
        value: /data

      # Required (set in Render dashboard / during Blueprint deploy)
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID_WEB
        sync: false

      # Email (Resend)
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false

      # Optional
      - key: REPLY_TO_EMAIL
        sync: false

    disk:
      name: app-data
      mountPath: /data
      sizeGB: 1
