// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

// EAS build environment commonly uses JDK 17. Force Android modules to compile with Java 17,
// even if some Capacitor modules default to a higher source/target level.
//
// @capacitor/local-notifications (added for the isolated deadline-reminder
// feature) is the first Kotlin-based Capacitor module in this project --
// its own build.gradle requests `kotlin { jvmToolchain(21) }`, which this
// override did NOT previously touch (it only patched the Java
// compileOptions above, a separate mechanism from Kotlin's own toolchain
// DSL). Left unpatched, that mismatch fails the build with "Inconsistent
// JVM-target compatibility detected... (17) and ...(21)". Pin the Kotlin
// compile target down to the same 17 for the same EAS-compatibility reason.
subprojects { subproject ->
    subproject.afterEvaluate {
        if (subproject.hasProperty('android')) {
            subproject.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        def kotlinExt = subproject.extensions.findByName('kotlin')
        if (kotlinExt != null) {
            kotlinExt.jvmToolchain(17)
        }
    }
}
